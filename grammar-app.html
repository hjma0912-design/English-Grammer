<title>형광펜 영문법</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one 680px column, list rows split by hairlines, fixed bottom tab bar. The highlighter is the only accent. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#14213D; --sub:#5B6783; --line:#D3DBEA;
  --hl:#DDF45B; --hl-mark:#DDF45B; --ok:#14704F; --bad:#BC3128;
  --ok-tint:#E7F3EE; --bad-tint:#FBEDEB; --press:#E8EDF6; --focus:#14213D;
  --font-en:"Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-ko:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#151E33; --ink:#E7ECF6; --sub:#9BA7C3; --line:#29355A;
    --hl:#DDF45B; --hl-mark:rgba(221,244,91,.36); --ok:#56C99D; --bad:#F27D71;
    --ok-tint:rgba(86,201,157,.13); --bad-tint:rgba(242,125,113,.13); --press:#1E2945; --focus:#DDF45B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#151E33; --ink:#E7ECF6; --sub:#9BA7C3; --line:#29355A;
  --hl:#DDF45B; --hl-mark:rgba(221,244,91,.36); --ok:#56C99D; --bad:#F27D71;
  --ok-tint:rgba(86,201,157,.13); --bad-tint:rgba(242,125,113,.13); --press:#1E2945; --focus:#DDF45B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-ko);font-size:16px;line-height:1.6;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.en,h1,h2,.num{font-family:var(--font-en)}
h1,h2,h3{text-wrap:balance;margin:0}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 32px)}
.wrap.notab{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}

/* highlighter: the signature mark, used for grammar points only */
.hl{background:linear-gradient(to bottom,transparent 54%,var(--hl-mark) 54%,var(--hl-mark) 94%,transparent 94%);color:inherit;padding:0 .08em;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.page-head{display:flex;flex-direction:column;gap:2px;padding-block:8px 18px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--sub);font-weight:500}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.section{padding-block:22px 4px;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0}
.sec-label{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em;margin:0 0 10px}
.muted{color:var(--sub)}
.small{font-size:14px}

.list{list-style:none;margin:0;padding:0}
.list>li{border-top:1px solid var(--line)}
.list>li:last-child{border-bottom:1px solid var(--line)}

/* buttons */
.btn{min-height:48px;padding:0 20px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-danger{background:var(--bad);color:#fff}
.btn-block{width:100%}
.btn:active{transform:translateY(1px)}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;flex:none}
.icon-btn:hover{background:var(--press)}
.icon-btn svg{width:22px;height:22px}
.star svg{fill:none;stroke:var(--sub);stroke-width:1.8}
.star[aria-pressed="true"] svg{fill:var(--hl);stroke:var(--ink)}

/* today */
.check-row{display:flex;align-items:center;gap:14px;min-height:64px;width:100%;text-align:left;padding:10px 4px}
.check-row:hover{background:var(--press)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.tick svg{width:16px;height:16px;stroke:var(--ink);stroke-width:3;fill:none;opacity:0}
.done .tick{background:var(--hl);border-color:var(--hl)}
.done .tick svg{opacity:1;stroke:#14213D}
.check-body{flex:1;min-width:0;display:flex;flex-direction:column}
.check-title{font-weight:700}
.done .check-title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1px}
.check-meta{font-size:14px;color:var(--sub)}
.chev{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2;flex:none}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--ink);border-color:var(--ink)}
.day.today{color:var(--ink);font-weight:700}
.day.today .dot{box-shadow:0 0 0 3px var(--hl-mark)}
.streak{display:flex;align-items:baseline;gap:8px;padding-block:14px 4px}
.streak .num{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-size:15px;text-align:left}
.chip .num{font-weight:800;font-size:14px;color:var(--sub)}

/* study list */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:0 8px}
.toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;font-size:15px;font-weight:500}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle[aria-pressed="true"] .switch{background:var(--ink)}
.toggle[aria-pressed="true"] .switch::after{transform:translateX(18px);background:var(--hl)}
.group-label{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.04em;padding-block:22px 8px}
.unit-row{display:flex;align-items:center;gap:4px}
.unit-open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 4px;text-align:left}
.unit-open:hover{background:var(--press)}
.unit-num{font-family:var(--font-en);font-weight:800;font-size:15px;color:var(--sub);width:26px;flex:none;font-variant-numeric:tabular-nums}
.unit-text{flex:1;min-width:0;display:flex;flex-direction:column}
.unit-title{font-family:var(--font-en);font-weight:600;font-size:17px;line-height:1.3}
.unit-sub{font-size:14px;color:var(--sub)}
.status{font-size:13px;white-space:nowrap;color:var(--sub);flex:none}
.status.done{color:var(--ink);font-weight:700}
.empty{padding:28px 4px;color:var(--sub)}

/* review tab */
.big-count{display:flex;align-items:baseline;gap:10px;padding-block:6px 18px}
.big-count .num{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.box{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-top:3px solid var(--line);font-size:12px;color:var(--sub)}
.box b{font-family:var(--font-en);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line)}
.stat{padding:14px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.stat .num{font-size:28px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--sub)}
.bar-row{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;align-items:center;padding-block:9px}
.bar-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-en)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;grid-column:2}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar-pct{font-size:13px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:3}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px}
.confirm p{flex:1 1 100%;margin:0;font-weight:700;color:var(--bad)}

/* unit detail */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;margin-inline:-8px;padding-block:4px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 4px;border-radius:10px;font-weight:500}
.back:hover{background:var(--press)}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.u-meta{font-size:13px;color:var(--sub);letter-spacing:.06em;font-weight:500}
.u-title{font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.015em;margin-top:6px}
.u-sub{font-size:17px;color:var(--sub);margin-top:4px}
.intro{margin:18px 0 6px;max-width:62ch}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
table{border-collapse:collapse;min-width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px 10px 0;vertical-align:top;white-space:nowrap}
td{white-space:normal;min-width:120px}
th{font-size:13px;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
td:first-child{font-weight:700}
.frame{border-left:5px solid var(--ink);padding:12px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-family:var(--font-en);font-size:17px;font-weight:600}
.ex{display:flex;gap:8px;align-items:flex-start;padding-block:10px}
.ex-text{flex:1;min-width:0;padding-top:8px}
.ex-en{font-family:var(--font-en);font-size:18px;line-height:1.45}
.ex-ko{font-size:14px;color:var(--sub)}
.speak svg{fill:none;stroke:var(--ink);stroke-width:1.8}
.speak.playing{background:var(--hl-mark)}
.mis{padding-block:12px;display:flex;flex-direction:column;gap:2px}
.mis-wrong{font-family:var(--font-en);color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;font-size:17px}
.mis-right{font-family:var(--font-en);color:var(--ok);font-weight:600;font-size:17px}
.mis-why{font-size:14px;color:var(--sub)}
.mark{display:inline-block;width:1.4em;font-family:var(--font-ko);font-weight:700;text-decoration:none}

/* quiz */
.q{padding-block:16px 18px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:4px}
.q-num{font-size:13px;color:var(--sub);font-weight:700;font-family:var(--font-en)}
.q-text{font-size:19px;line-height:1.5;margin:4px 0 12px;font-family:var(--font-en)}
.q-text .ko{font-family:var(--font-ko);font-size:15px;color:var(--sub)}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);margin:0 .1em;line-height:1.1}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-family:var(--font-en);font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--bad)}
.opt.dim{opacity:.55}
.opt .tag{font-family:var(--font-ko);font-size:13px;font-weight:700}
.fb{margin-top:12px;padding-left:12px;border-left:3px solid var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.fb strong{display:block}
.fb.ok strong{color:var(--ok)}
.fb.bad strong{color:var(--bad)}
.fb p{margin:2px 0 0;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions .btn{flex:1 1 160px}
.quiz-done{padding:16px 0 4px;display:flex;flex-direction:column;gap:12px}

/* session */
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.card-from{font-size:13px;color:var(--sub);margin-bottom:2px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-inner{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{min-height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:12px;font-weight:500;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;line-height:18px;font-family:var(--font-en)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] .tab-label{background:linear-gradient(to bottom,transparent 50%,var(--hl-mark) 50%,var(--hl-mark) 95%,transparent 95%);padding:0 4px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media (max-width:420px){
  .u-title{font-size:29px}
  .page-title{font-size:27px}
}
</style>

<div id="app" class="wrap" aria-live="off"></div>

<script>
(function(){
"use strict";
const UNITS = [{"id":1,"group":"기초 문장","title":"I am, You are, She is","sub":"be동사 현재형","intro":"be동사는 '~이다, ~에 있다'라는 뜻으로 주어의 정체나 상태, 위치를 말해요. 주어에 따라 am, is, are 중 하나를 골라 써요.","table":{"head":["주어","be동사","줄임말"],"rows":[["I","am","I'm"],["You / We / They","are","you're, we're, they're"],["He / She / It","is","he's, she's, it's"],["단수 명사 (Tom, my dog)","is","Tom's"],["복수 명사 (my friends)","are","-"]]},"frame":["주어 + am / is / are + 명사 · 형용사 · 장소"],"examples":[["I **am** a student.","나는 학생이에요."],["She **is** very kind.","그녀는 아주 친절해요."],["We **are** in the classroom.","우리는 교실에 있어요."],["My parents **are** teachers.","우리 부모님은 선생님이에요."],["It**'s** cold today.","오늘은 추워요."]],"mistakes":[["She are my sister.","She is my sister.","She는 3인칭 단수라서 is를 써요."],["I is hungry.","I am hungry.","I 뒤에는 항상 am이 와요."],["My friends is here.","My friends are here.","friends는 복수라서 are를 써요."]],"quiz":[{"q":"They ___ from Korea.","options":["are","is","am"],"why":"They는 복수 주어라서 are를 써요."},{"q":"My brother ___ tall.","options":["is","are","am"],"why":"My brother는 한 사람(3인칭 단수)이라서 is예요."},{"q":"다음 중 바른 문장은?","options":["I am tired.","I is tired.","I are tired."],"why":"I와 짝이 되는 be동사는 am이에요."}]},{"id":2,"group":"기초 문장","title":"Isn't it? Are you?","sub":"be동사 부정문과 의문문","intro":"be동사 문장은 be동사 뒤에 not을 붙이면 부정문, 주어와 be동사의 자리를 바꾸면 의문문이 돼요. do는 필요 없어요.","table":{"head":["종류","형태","예"],"rows":[["긍정","주어 + be","He is busy."],["부정","주어 + be + not","He is not (isn't) busy."],["의문","Be + 주어 ~?","Is he busy?"],["짧은 대답","Yes, 주어 + be. / No, 주어 + be + not.","Yes, he is. / No, he isn't."]]},"frame":["부정: 주어 + am / is / are + not","의문: Am / Is / Are + 주어 ~?"],"examples":[["I**'m not** sleepy.","나는 졸리지 않아요."],["This **isn't** my bag.","이건 내 가방이 아니에요."],["**Are you** ready?","준비됐어요?"],["**Is she** your teacher?","그녀가 너의 선생님이니?"],["\"Are they at home?\" \"No, they **aren't**.\"","\"그들은 집에 있니?\" \"아니, 없어.\""]],"mistakes":[["Do you are happy?","Are you happy?","be동사 의문문에는 do를 쓰지 않아요."],["She not is busy.","She is not busy.","not은 be동사 뒤에 와요."],["Yes, I'm.","Yes, I am.","짧은 긍정 대답은 줄임말로 끝내지 않아요."]],"quiz":[{"q":"___ your sister a nurse?","options":["Is","Are","Do"],"why":"your sister는 3인칭 단수이고 be동사 의문문이라 Is로 시작해요."},{"q":"He ___ at school now. (그는 지금 학교에 없어요.)","options":["isn't","doesn't","not"],"why":"be동사 부정은 is + not = isn't예요."},{"q":"\"Are you a student?\"에 대한 알맞은 긍정 대답은?","options":["Yes, I am.","Yes, I'm.","Yes, you are."],"why":"나에 대한 질문이니 I am으로 답하고, 끝을 I'm으로 줄이지 않아요."}]},{"id":3,"group":"현재 시제","title":"She plays, He goes","sub":"일반동사 현재형과 3인칭 단수 -s","intro":"습관, 반복되는 일, 변하지 않는 사실은 현재형으로 말해요. 주어가 3인칭 단수(he, she, it, 사람이나 물건 하나)일 때는 동사 끝에 -s나 -es를 붙여요.","table":{"head":["동사 끝","규칙","예"],"rows":[["대부분","+ s","like → likes, read → reads"],["-s, -sh, -ch, -x, -o","+ es","watch → watches, go → goes"],["자음 + y","y → ies","study → studies, cry → cries"],["모음 + y","+ s","play → plays, buy → buys"],["예외","모양이 바뀜","have → has"]]},"frame":["I / You / We / They + 동사원형","He / She / It + 동사 + -s / -es"],"examples":[["I **drink** milk every morning.","나는 매일 아침 우유를 마셔요."],["She **plays** the piano.","그녀는 피아노를 쳐요."],["My dad **watches** the news at night.","아빠는 밤에 뉴스를 보세요."],["Tom **studies** English every day.","톰은 매일 영어를 공부해요."],["The sun **rises** in the east.","해는 동쪽에서 떠요."]],"mistakes":[["He like pizza.","He likes pizza.","주어가 He이면 동사에 -s를 붙여요."],["She haves a cat.","She has a cat.","have의 3인칭 단수형은 has예요."],["My mom studys at night.","My mom studies at night.","자음 + y는 y를 i로 바꾸고 -es를 붙여요."]],"quiz":[{"q":"My sister ___ to school by bus.","options":["goes","go","gos"],"why":"3인칭 단수이고 -o로 끝나는 동사라 -es를 붙여 goes예요."},{"q":"We ___ soccer after school.","options":["play","plays","playes"],"why":"We는 복수라서 동사원형을 써요."},{"q":"다음 중 3인칭 단수형이 바르게 쓰인 것은?","options":["fly → flies","fly → flys","watch → watchs"],"why":"자음 + y는 ies로, ch로 끝나면 es를 붙여요."}]},{"id":4,"group":"현재 시제","title":"Do you? He doesn't.","sub":"일반동사 현재 부정문과 의문문","intro":"일반동사 문장을 부정하거나 질문할 때는 do 또는 does의 도움을 받아요. does를 쓰면 -s는 does가 가져가므로 뒤의 동사는 항상 원형이 돼요.","table":{"head":["주어","부정","의문"],"rows":[["I / You / We / They","don't + 동사원형","Do + 주어 + 동사원형 ~?"],["He / She / It","doesn't + 동사원형","Does + 주어 + 동사원형 ~?"]]},"frame":["부정: 주어 + don't / doesn't + 동사원형","의문: Do / Does + 주어 + 동사원형 ~?"],"examples":[["I **don't eat** meat.","나는 고기를 먹지 않아요."],["He **doesn't like** cold weather.","그는 추운 날씨를 좋아하지 않아요."],["**Do you speak** English?","영어 할 줄 아세요?"],["**Does she live** near here?","그녀는 이 근처에 사니?"],["\"Does it rain a lot here?\" \"Yes, it **does**.\"","\"여기는 비가 많이 오나요?\" \"네, 그래요.\""]],"mistakes":[["She doesn't likes coffee.","She doesn't like coffee.","doesn't 뒤에는 동사원형을 써요."],["Does he plays tennis?","Does he play tennis?","Does가 -s 역할을 하니까 동사는 원형이에요."],["They doesn't know.","They don't know.","They는 복수라서 don't를 써요."]],"quiz":[{"q":"___ your brother play the guitar?","options":["Does","Do","Is"],"why":"your brother는 3인칭 단수이고 일반동사 play가 있으니 Does예요."},{"q":"I ___ watch TV on weekdays.","options":["don't","doesn't","am not"],"why":"주어 I에는 don't를 써요."},{"q":"다음 중 바른 문장은?","options":["He doesn't have a car.","He doesn't has a car.","He don't have a car."],"why":"He에는 doesn't, 그 뒤에는 동사원형 have가 와요."}]},{"id":5,"group":"현재 시제","title":"I'm reading now","sub":"현재진행형 be + -ing","intro":"지금 이 순간 하고 있는 일은 현재진행형으로 말해요. be동사(am / is / are) 뒤에 동사 + -ing를 붙여요. now, right now, Look! 같은 말과 자주 함께 써요.","table":{"head":["비교","현재형","현재진행형"],"rows":[["뜻","평소의 습관 · 사실","지금 하고 있는 일"],["형태","동사 (+ -s)","am / is / are + 동사-ing"],["예","I walk to school.","I am walking to school now."],["함께 쓰는 말","every day, usually","now, right now, at the moment"]]},"frame":["주어 + am / is / are + 동사-ing"],"examples":[["I**'m reading** a book now.","나는 지금 책을 읽고 있어요."],["Look! The baby **is sleeping**.","봐! 아기가 자고 있어."],["They **are playing** soccer in the park.","그들은 공원에서 축구를 하고 있어요."],["**Is** it **raining** outside?","밖에 비가 오고 있니?"],["She **isn't watching** TV right now.","그녀는 지금 TV를 보고 있지 않아요."]],"mistakes":[["I reading a book.","I am reading a book.","진행형에는 be동사가 꼭 필요해요."],["He is runing.","He is running.","단모음 + 단자음으로 끝나는 run은 n을 한 번 더 써요."],["She is makeing dinner.","She is making dinner.","-e로 끝나는 동사는 e를 빼고 -ing를 붙여요."]],"quiz":[{"q":"Be quiet! The kids ___ .","options":["are sleeping","sleep","is sleeping"],"why":"the kids는 복수이고 지금 하는 일이라 are sleeping이에요."},{"q":"Look! He ___ his bike.","options":["is riding","rides","riding"],"why":"Look!은 지금 일어나는 일의 신호라서 is riding이에요."},{"q":"swim의 -ing 형태로 맞는 것은?","options":["swimming","swiming","swimeing"],"why":"단모음 + 단자음(m)으로 끝나면 자음을 한 번 더 써요."}]},{"id":6,"group":"명사","title":"One apple, two apples","sub":"셀 수 있는 명사와 셀 수 없는 명사","intro":"영어는 셀 수 있는 명사와 셀 수 없는 명사를 구분해요. 셀 수 있는 명사는 하나일 때 a / an, 둘 이상일 때 복수형을 쓰고, 셀 수 없는 명사(물, 돈, 시간, 정보 등)는 복수형이 없어요.","table":{"head":["구분","예","쓰는 법"],"rows":[["셀 수 있음","book, egg, friend","a book, two books, many books"],["셀 수 없음","water, money, bread, advice","some water, much money"],["불규칙 복수","man, child, tooth, mouse","men, children, teeth, mice"],["단위로 세기","bread, water, paper","a piece of bread, a glass of water"]]},"frame":["셀 수 있음: a / an + 단수 명사, 숫자 + 복수 명사","셀 수 없음: some / much / a little + 명사 (복수형 없음)"],"examples":[["I have **two sisters**.","나는 여동생이 두 명 있어요."],["There are **three boxes** on the desk.","책상 위에 상자가 세 개 있어요."],["Can I have **some water**?","물 좀 마실 수 있을까요?"],["We don't have **much time**.","우리는 시간이 많지 않아요."],["She ate **a piece of cake**.","그녀는 케이크 한 조각을 먹었어요."],["The **children** are playing.","아이들이 놀고 있어요."]],"mistakes":[["I need an advice.","I need some advice.","advice는 셀 수 없어서 an을 붙이지 않아요."],["I have many homeworks.","I have a lot of homework.","homework는 셀 수 없는 명사예요."],["Two childs are here.","Two children are here.","child의 복수형은 children이에요."]],"quiz":[{"q":"There are five ___ in the room.","options":["chairs","chair","chaires"],"why":"five 뒤에는 복수형 chairs가 와요."},{"q":"Please give me a ___ of water.","options":["glass","piece","water"],"why":"물은 셀 수 없어서 a glass of로 세요."},{"q":"다음 중 셀 수 없는 명사는?","options":["money","coin","dollar"],"why":"money는 셀 수 없고, coin과 dollar는 셀 수 있어요."}]},{"id":7,"group":"명사","title":"a, an, the","sub":"관사","intro":"a / an은 여러 개 중 하나를 처음 말할 때, the는 서로 알고 있는 '바로 그것'을 말할 때 써요. a와 an은 철자가 아니라 첫 소리로 정해요.","table":{"head":["관사","쓰는 때","예"],"rows":[["a","자음 소리로 시작하는 단수 명사","a cat, a university, a big egg"],["an","모음 소리로 시작하는 단수 명사","an apple, an hour, an old man"],["the","이미 말한 것, 하나뿐인 것","the sun, the moon, the door"],["(없음)","식사, 운동, 과목 이름","have lunch, play soccer, study math"]]},"frame":["처음 말할 때: a / an + 단수 명사","다시 말할 때 · 하나뿐일 때: the + 명사"],"examples":[["I saw **a** dog. **The** dog was very big.","나는 개를 봤어요. 그 개는 아주 컸어요."],["She eats **an** egg every morning.","그녀는 매일 아침 달걀 하나를 먹어요."],["I waited for **an** hour.","나는 한 시간 동안 기다렸어요."],["**The** moon is bright tonight.","오늘 밤 달이 밝아요."],["Please close **the** door.","문 좀 닫아 주세요."]],"mistakes":[["I ate a apple.","I ate an apple.","apple은 모음 소리로 시작해서 an을 써요."],["He is an university student.","He is a university student.","university는 '유'라는 자음 소리로 시작해요."],["I play the soccer.","I play soccer.","운동 이름 앞에는 관사를 쓰지 않아요."]],"quiz":[{"q":"I want to be ___ engineer.","options":["an","a","the"],"why":"engineer는 모음 소리로 시작해서 an이에요."},{"q":"___ sun rises in the east.","options":["The","A","An"],"why":"해는 하나뿐이라서 the를 써요."},{"q":"다음 중 바른 문장은?","options":["We have lunch at noon.","We have a lunch at noon.","We have the lunch at noon."],"why":"식사 이름 앞에는 보통 관사를 쓰지 않아요."}]},{"id":8,"group":"명사","title":"I, me, my, mine","sub":"인칭대명사의 격","intro":"대명사는 문장 속 역할에 따라 모양이 바뀌어요. 주어 자리에는 주격, 동사나 전치사 뒤에는 목적격, 명사 앞에는 소유격을 쓰고, '~의 것'은 소유대명사로 말해요.","table":{"head":["주격 (~는)","목적격 (~를)","소유격 (~의)","소유대명사 (~의 것)"],"rows":[["I","me","my","mine"],["you","you","your","yours"],["he","him","his","his"],["she","her","her","hers"],["it","it","its","-"],["we","us","our","ours"],["they","them","their","theirs"]]},"frame":["주격 + 동사 + 목적격","소유격 + 명사 (my book) = 소유대명사 (mine)"],"examples":[["**She** likes **me**.","그녀는 나를 좋아해요."],["I know **him** well.","나는 그를 잘 알아요."],["This is **our** classroom.","여기가 우리 교실이에요."],["Is this pen **yours**?","이 펜 네 거야?"],["The dog is wagging **its** tail.","개가 꼬리를 흔들고 있어요."]],"mistakes":[["Me like music.","I like music.","주어 자리에는 주격 I를 써요."],["Can you help I?","Can you help me?","동사 뒤 목적어 자리에는 목적격 me를 써요."],["This bag is my.","This bag is mine.","명사 없이 '내 것'이라고 할 때는 mine을 써요."]],"quiz":[{"q":"Please call ___ tonight.","options":["her","she","hers"],"why":"동사 call 뒤에는 목적격 her가 와요."},{"q":"That is ___ house. (그들의 집)","options":["their","them","theirs"],"why":"명사 house 앞에는 소유격 their를 써요."},{"q":"The book is not mine. It's ___ .","options":["his","he","him"],"why":"'그의 것'은 소유대명사 his예요."}]},{"id":9,"group":"과거 시제","title":"I was, They were","sub":"be동사 과거형","intro":"과거의 상태나 위치를 말할 때는 be동사의 과거형 was와 were를 써요. am과 is는 was로, are는 were로 바뀌어요.","table":{"head":["주어","현재","과거"],"rows":[["I","am","was"],["He / She / It","is","was"],["You / We / They","are","were"],["부정","isn't, aren't","wasn't, weren't"]]},"frame":["주어 + was / were + 명사 · 형용사 · 장소","의문: Was / Were + 주어 ~?"],"examples":[["I **was** tired yesterday.","나는 어제 피곤했어요."],["We **were** at the beach last summer.","우리는 지난여름에 해변에 있었어요."],["The movie **wasn't** interesting.","그 영화는 재미없었어요."],["**Were** you at home last night?","어젯밤에 집에 있었니?"],["My grandfather **was** a doctor.","우리 할아버지는 의사셨어요."]],"mistakes":[["They was happy.","They were happy.","They는 복수라서 were를 써요."],["I were sick last week.","I was sick last week.","I의 be동사 과거형은 was예요."],["Did you were busy?","Were you busy?","be동사 과거 의문문에는 did를 쓰지 않아요."]],"quiz":[{"q":"It ___ very hot yesterday.","options":["was","were","is"],"why":"It은 단수이고 yesterday는 과거라서 was예요."},{"q":"___ your friends at the party?","options":["Were","Was","Did"],"why":"friends는 복수라서 Were로 시작해요."},{"q":"I ___ at school yesterday. (나는 어제 학교에 없었어요.)","options":["wasn't","weren't","didn't"],"why":"I + be동사 과거 부정은 wasn't예요."}]},{"id":10,"group":"과거 시제","title":"played, went, ate","sub":"일반동사 과거형 (규칙과 불규칙)","intro":"이미 끝난 일은 과거형으로 말해요. 대부분의 동사는 -ed를 붙이지만, 자주 쓰는 동사 중에는 모양이 완전히 바뀌는 불규칙 동사가 많아요. 과거형은 주어가 무엇이든 모양이 같아요.","table":{"head":["종류","규칙","예"],"rows":[["대부분","+ ed","play → played, watch → watched"],["-e로 끝남","+ d","like → liked, live → lived"],["자음 + y","y → ied","study → studied, cry → cried"],["단모음 + 단자음","자음 한 번 더 + ed","stop → stopped, plan → planned"],["불규칙","따로 외워요","go → went, eat → ate, see → saw, have → had"]]},"frame":["주어 + 동사-ed / 불규칙 과거형 (+ yesterday, last ~, ~ ago)"],"examples":[["I **watched** a movie last night.","나는 어젯밤에 영화를 봤어요."],["She **studied** for three hours.","그녀는 세 시간 동안 공부했어요."],["We **went** to Busan last weekend.","우리는 지난 주말에 부산에 갔어요."],["He **ate** breakfast at seven.","그는 7시에 아침을 먹었어요."],["The bus **stopped** suddenly.","버스가 갑자기 멈췄어요."]],"mistakes":[["I goed to the park.","I went to the park.","go는 불규칙 동사라서 과거형이 went예요."],["She studyed hard.","She studied hard.","자음 + y는 y를 i로 바꾸고 -ed를 붙여요."],["He plays soccer yesterday.","He played soccer yesterday.","yesterday는 과거라서 과거형을 써요."]],"quiz":[{"q":"We ___ a great time at the party.","options":["had","haved","have"],"why":"have의 과거형은 had예요."},{"q":"I ___ my friend at the mall yesterday.","options":["saw","seed","see"],"why":"see는 불규칙 동사라서 과거형이 saw예요."},{"q":"다음 중 과거형이 바르게 쓰인 것은?","options":["stop → stopped","stop → stoped","cry → cryed"],"why":"stop은 p를 한 번 더 쓰고, cry는 cried가 돼요."}]},{"id":11,"group":"과거 시제","title":"Did you? I didn't.","sub":"일반동사 과거 부정문과 의문문","intro":"일반동사 과거 문장을 부정하거나 질문할 때는 did를 써요. did가 과거를 맡으므로 뒤의 동사는 원형으로 돌아가요. 주어와 상관없이 did 하나만 써요.","table":{"head":["종류","형태","예"],"rows":[["긍정","주어 + 과거형","She called me."],["부정","주어 + didn't + 동사원형","She didn't call me."],["의문","Did + 주어 + 동사원형 ~?","Did she call you?"],["짧은 대답","Yes, 주어 + did. / No, 주어 + didn't.","Yes, she did. / No, she didn't."]]},"frame":["부정: 주어 + didn't + 동사원형","의문: Did + 주어 + 동사원형 ~?"],"examples":[["I **didn't sleep** well last night.","나는 어젯밤에 잘 못 잤어요."],["He **didn't come** to school today.","그는 오늘 학교에 오지 않았어요."],["**Did you finish** your homework?","숙제 다 했니?"],["**Did they win** the game?","그들이 경기에서 이겼니?"],["\"Did you see Mina?\" \"No, I **didn't**.\"","\"미나 봤어?\" \"아니, 못 봤어.\""]],"mistakes":[["I didn't went there.","I didn't go there.","didn't 뒤에는 동사원형을 써요."],["Did she bought it?","Did she buy it?","Did가 과거를 나타내니까 동사는 원형이에요."],["Do you see him yesterday?","Did you see him yesterday?","yesterday는 과거라서 Did로 물어요."]],"quiz":[{"q":"___ you call me last night?","options":["Did","Do","Were"],"why":"어젯밤 일이고 일반동사 call이 있으니 Did예요."},{"q":"She didn't ___ the news.","options":["hear","heard","hears"],"why":"didn't 뒤에는 동사원형 hear가 와요."},{"q":"\"Did he enjoy the trip?\"에 대한 알맞은 부정 대답은?","options":["No, he didn't.","No, he doesn't.","No, he wasn't."],"why":"Did로 물었으니 didn't로 답해요."}]},{"id":12,"group":"미래와 조동사","title":"will vs. be going to","sub":"미래 표현","intro":"앞으로 일어날 일은 will이나 be going to로 말해요. will은 말하는 순간 정한 일이나 예측에, be going to는 미리 세운 계획이나 눈앞에 근거가 있는 예측에 자주 써요.","table":{"head":["비교","will","be going to"],"rows":[["형태","will + 동사원형","am / is / are going to + 동사원형"],["즉석 결정","The phone's ringing. I'll get it!","-"],["미리 세운 계획","-","I'm going to visit my aunt this Sunday."],["예측","It will be sunny tomorrow.","Look at the clouds. It's going to rain."],["부정","won't + 동사원형","am / is / are not going to + 동사원형"]]},"frame":["주어 + will + 동사원형","주어 + am / is / are + going to + 동사원형"],"examples":[["I**'ll help** you with your bag.","가방 드는 거 도와줄게요."],["She **will be** 15 next year.","그녀는 내년에 열다섯 살이 돼요."],["We**'re going to watch** a movie tonight.","우리는 오늘 밤에 영화를 볼 거예요."],["I **won't tell** anyone.","아무에게도 말하지 않을게."],["**Are** you **going to join** the club?","너 그 동아리에 들어갈 거야?"]],"mistakes":[["I will to go there.","I will go there.","will 뒤에는 to 없이 동사원형을 써요."],["She will goes home.","She will go home.","will 뒤의 동사는 주어와 상관없이 원형이에요."],["He going to study.","He is going to study.","be going to에서 be동사를 빠뜨리면 안 돼요."]],"quiz":[{"q":"I ___ visit my grandma next week. (이미 정해 둔 계획)","options":["am going to","will to","going to"],"why":"미리 정한 계획이고, 주어 I에 맞는 형태는 am going to예요."},{"q":"It's dark. I ___ turn on the light. (지금 막 결정)","options":["will","am","going"],"why":"말하는 순간 결정한 일이라 will을 써요."},{"q":"다음 중 바른 문장은?","options":["They will arrive soon.","They will arrives soon.","They will arriving soon."],"why":"will 뒤에는 동사원형이 와요."}]},{"id":13,"group":"미래와 조동사","title":"can, must, should","sub":"조동사: 능력, 의무, 충고","intro":"조동사는 동사 앞에서 능력, 허락, 의무, 충고 같은 뜻을 더해 줘요. 조동사 뒤에는 항상 동사원형이 오고, 주어가 3인칭 단수여도 -s를 붙이지 않아요.","table":{"head":["조동사","뜻","부정","예"],"rows":[["can","~할 수 있다, ~해도 된다","can't","I can swim."],["must","~해야 한다 (강한 의무)","mustn't (~하면 안 된다)","You must wear a seatbelt."],["have to","~해야 한다","don't have to (~할 필요 없다)","She has to get up early."],["should","~하는 게 좋겠다 (충고)","shouldn't","You should see a doctor."]]},"frame":["주어 + 조동사 + 동사원형","의문: 조동사 + 주어 + 동사원형 ~?"],"examples":[["My sister **can speak** Chinese.","내 여동생은 중국어를 할 수 있어요."],["**Can** I **use** your phone?","휴대폰 좀 써도 될까요?"],["Students **must wear** uniforms.","학생들은 교복을 입어야 해요."],["You **should drink** more water.","물을 더 마시는 게 좋겠어요."],["You **don't have to** hurry.","서두를 필요 없어요."]],"mistakes":[["He cans play the drums.","He can play the drums.","조동사에는 -s를 붙이지 않아요."],["You should to rest.","You should rest.","should 뒤에는 to 없이 동사원형을 써요."],["She can sings well.","She can sing well.","조동사 뒤의 동사는 원형이에요."]],"quiz":[{"q":"You look tired. You ___ go to bed early.","options":["should","mustn't","can't"],"why":"피곤해 보이는 사람에게 하는 충고라서 should예요."},{"q":"Penguins ___ fly. (펭귄은 날 수 없어요.)","options":["can't","don't can","mustn't"],"why":"할 수 없는 능력은 can't로 말해요."},{"q":"다음 중 바른 문장은?","options":["He must finish it today.","He musts finish it today.","He must finishes it today."],"why":"must에는 -s가 붙지 않고, 뒤에 동사원형이 와요."}]},{"id":14,"group":"전치사","title":"in, on, at","sub":"시간과 장소의 전치사","intro":"in, on, at은 시간과 장소를 나타내요. 범위가 넓으면 in, 날짜 · 요일이나 표면 위는 on, 정확한 시각이나 한 지점은 at을 써요.","table":{"head":["전치사","시간","장소"],"rows":[["in","월, 계절, 연도, 하루의 때 (in May, in 2025, in the morning)","넓은 공간 · 도시 · 나라, 안쪽 (in Seoul, in the box)"],["on","요일, 날짜, 특별한 날 (on Monday, on July 4th)","표면 위, 거리 (on the table, on the wall)"],["at","시각, 짧은 때 (at 7:30, at noon, at night)","특정 지점 (at the bus stop, at home, at school)"]]},"frame":["in (넓은 범위) → on (날짜 · 표면) → at (한 점)"],"examples":[["My birthday is **in** March.","내 생일은 3월이에요."],["See you **on** Friday.","금요일에 봐요."],["The class starts **at** 9 o'clock.","수업은 9시에 시작해요."],["There is a picture **on** the wall.","벽에 그림이 하나 걸려 있어요."],["I'll wait for you **at** the bus stop.","버스 정류장에서 기다릴게요."],["She lives **in** Busan.","그녀는 부산에 살아요."]],"mistakes":[["I was born on 2010.","I was born in 2010.","연도 앞에는 in을 써요."],["Let's meet in Sunday.","Let's meet on Sunday.","요일 앞에는 on을 써요."],["I get up in 7 o'clock.","I get up at 7 o'clock.","정확한 시각 앞에는 at을 써요."]],"quiz":[{"q":"We have no school ___ Saturday.","options":["on","in","at"],"why":"요일 앞에는 on을 써요."},{"q":"I usually read ___ night.","options":["at","in","on"],"why":"'밤에'는 at night으로 말해요."},{"q":"The keys are ___ the box.","options":["in","at","on"],"why":"상자 안에 있으니 in이에요."}]}];
const GROUPS = ["기초 문장","현재 시제","명사","과거 시제","미래와 조동사","전치사"];
const INTERVALS = [0,0,1,3,7,14,30]; // index = box (1..6); index 0 = new card
const KEY = "hl-grammar-v1";
const EXTRA_N = 10;

/* ---------- storage ---------- */
function blank(){ return {cards:{}, completed:{}, log:{}, favs:[]}; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    if(!d || typeof d !== "object") return blank();
    const b = blank();
    return {
      cards: d.cards && typeof d.cards==="object" ? d.cards : b.cards,
      completed: d.completed && typeof d.completed==="object" ? d.completed : b.completed,
      log: d.log && typeof d.log==="object" ? d.log : b.log,
      favs: Array.isArray(d.favs) ? d.favs : b.favs
    };
  }catch(e){ return blank(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* ---------- dates ---------- */
function ymd(d){ const m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd; }
function today(){ return ymd(new Date()); }
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); return ymd(new Date(y,m-1,d+n)); }
function dayLog(key){
  key = key || today();
  if(!S.log[key]) S.log[key] = {answered:0, correct:0, units:[], read:false};
  const l = S.log[key]; if(!Array.isArray(l.units)) l.units=[];
  return l;
}
function peekLog(key){ return S.log[key] || null; }

/* ---------- helpers ---------- */
const $ = (s,el)=> (el||document).querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<mark class="hl">$1</mark>'); }
function plain(s){ return String(s).replace(/\*\*/g,""); }
function pad(n){ return (n<10?"0":"")+n; }
function unitById(id){ return UNITS.find(u=>u.id===id); }
function cardId(uid,qi){ return uid+"-"+qi; }
function parseCard(id){ const [u,q]=id.split("-").map(Number); return {unit:unitById(u), qi:q}; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function isFav(id){ return S.favs.indexOf(id)>=0; }
function toggleFav(id){ const i=S.favs.indexOf(id); if(i>=0) S.favs.splice(i,1); else S.favs.push(id); save(); }

function mastery(u){
  let sum=0;
  for(let i=0;i<u.quiz.length;i++){ const c=S.cards[cardId(u.id,i)]; if(c) sum += (c.box-1)/5; }
  return Math.round(sum/u.quiz.length*100);
}
function unitStarted(u){ return u.quiz.some((_,i)=>S.cards[cardId(u.id,i)]); }
function dueIds(){
  const t=today();
  return Object.keys(S.cards).filter(id=>S.cards[id].due<=t && parseCard(id).unit)
    .sort((a,b)=> S.cards[a].due<S.cards[b].due?-1:S.cards[a].due>S.cards[b].due?1:S.cards[a].box-S.cards[b].box);
}
function streak(){
  let k=today(), n=0;
  const studied = key => { const l=peekLog(key); return !!(l && l.answered>0); };
  if(!studied(k)) k = addDays(k,-1);
  while(studied(k)){ n++; k=addDays(k,-1); }
  return n;
}
function totals(){
  let answered=0, correct=0, days=0;
  Object.keys(S.log).forEach(k=>{ const l=S.log[k]; answered+=l.answered||0; correct+=l.correct||0; if(l.answered>0) days++; });
  return {answered, correct, days};
}

/* ---------- SRS ---------- */
function record(id, ok, mode){
  const l = dayLog(); l.answered++; if(ok) l.correct++;
  const t = today(), c = S.cards[id];
  if(mode==="unit"){
    if(!c){ const box = ok?2:1; S.cards[id] = {box, due:addDays(t,INTERVALS[box])}; }
  } else if(mode==="review"){
    const box = ok ? Math.min(6,(c?c.box:1)+1) : 1;
    S.cards[id] = {box, due:addDays(t,INTERVALS[box])};
  }
  save();
}

/* ---------- speech ---------- */
let speakingBtn = null;
function speak(text, btn){
  try{
    const synth = window.speechSynthesis;
    if(!synth || typeof SpeechSynthesisUtterance==="undefined"){ return; }
    synth.cancel();
    if(speakingBtn) speakingBtn.classList.remove("playing");
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    const v = (synth.getVoices()||[]).find(v=>/en[-_]US/i.test(v.lang));
    if(v) u.voice = v;
    if(btn){ speakingBtn=btn; btn.classList.add("playing"); u.onend=u.onerror=()=>btn.classList.remove("playing"); }
    synth.speak(u);
  }catch(e){}
}

/* ---------- question rendering (shared) ---------- */
function qTextHTML(q, filled){
  let s = esc(q.q);
  s = s.replace(/\(([^)]*[가-힣][^)]*)\)/g, '<span class="ko">($1)</span>');
  if(s.indexOf("___")>=0){
    s = s.replace("___", filled ? '<mark class="hl">'+esc(q.options[0])+'</mark>' : '<span class="blank" aria-label="빈칸"></span>');
  }
  if(/[가-힣]/.test(q.q) && !/\(/.test(q.q)) s = '<span style="font-family:var(--font-ko)">'+s+'</span>';
  return s;
}
function questionHTML(q, order, chosen, label, extraActions){
  const answered = chosen!==null && chosen!==undefined;
  const opts = order.map(oi=>{
    let cls="opt", tag="";
    if(answered){
      if(oi===0){ cls+=" correct"; tag='<span class="tag">정답</span>'; }
      else if(oi===chosen){ cls+=" wrong"; tag='<span class="tag">내 답</span>'; }
      else cls+=" dim";
    }
    return '<button class="'+cls+'" data-act="answer" data-oi="'+oi+'"'+(answered?' disabled':'')+' lang="en">'+esc(q.options[oi])+tag+'</button>';
  }).join("");
  let fb='';
  if(answered){
    const ok = chosen===0;
    fb = '<div class="fb '+(ok?'ok':'bad')+'" role="status" tabindex="-1"><strong>'+(ok?'정답이에요':'아쉬워요. 정답은 '+esc(q.options[0]))+'</strong><p>'+esc(q.why)+'</p></div>'+(extraActions||'');
  }
  return '<div class="q-num">'+label+'</div><p class="q-text">'+qTextHTML(q, answered)+'</p><div class="opts" role="group" aria-label="보기">'+opts+'</div>'+fb;
}

/* ---------- unit quiz ---------- */
function freshQuiz(u){ unitQuiz[u.id] = {orders:u.quiz.map(q=>shuffle(q.options.map((_,i)=>i))), chosen:u.quiz.map(()=>null), finished:false}; }
function mountUnitQuiz(u, focusIdx){
  if(!unitQuiz[u.id]) freshQuiz(u);
  const st = unitQuiz[u.id];
  const box = $("#unit-quiz");
  box.innerHTML = u.quiz.map((q,i)=>'<div class="q" data-qi="'+i+'">'+questionHTML(q, st.orders[i], st.chosen[i], 'Q'+(i+1))+'</div>').join("")+
    (st.chosen.every(c=>c!==null) ? '<div class="quiz-done" role="status"><strong>'+st.chosen.filter(c=>c===0).length+' / 3 정답 · 유닛 학습 완료</strong><span class="muted small">푼 문제는 복습 카드가 되었어요. 틀린 문제는 오늘 복습에 다시 나와요.</span><div class="actions"><button class="btn btn-line" data-act="retry-quiz">보기 섞어서 다시 풀기</button>'+(V.fromSession?'':'<button class="btn btn-primary" data-act="tab" data-tab="study">유닛 목록</button>')+'</div></div>' : '');
  if(focusIdx!==undefined){ const f=box.querySelector('.q[data-qi="'+focusIdx+'"] .fb'); if(f) f.focus({preventScroll:true}); }
}
function answerUnit(u, qi, oi){
  const st = unitQuiz[u.id]; if(st.chosen[qi]!==null) return;
  st.chosen[qi]=oi;
  record(cardId(u.id,qi), oi===0, "unit");
  if(st.chosen.every(c=>c!==null) && !st.finished){
    st.finished=true;
    if(!S.completed[u.id]) S.completed[u.id]=today();
    const l=dayLog(); if(l.units.indexOf(u.id)<0) l.units.push(u.id);
    save();
  }
  mountUnitQuiz(u, qi);
  renderTabs();
}

/* ---------- review session ---------- */
function startSession(mode){
  let ids;
  if(mode==="review") ids = shuffle(dueIds());
  else ids = shuffle(Object.keys(S.cards).filter(id=>parseCard(id).unit)).slice(0,EXTRA_N);
  if(!ids.length) return;
  V.session = {mode, queue:ids, idx:0, total:ids.length, right:0, done:0, chosen:null, order:null};
  prepCard(); render(true);
}
function prepCard(){ const s=V.session; const id=s.queue[s.idx]; if(!id) return; const {unit,qi}=parseCard(id); s.order=shuffle(unit.quiz[qi].options.map((_,i)=>i)); s.chosen=null; }
function viewSession(){
  const s=V.session, title = s.mode==="review"?"오늘의 복습":"추가 연습";
  if(s.idx>=s.queue.length){
    const left = dueIds().length;
    return '<div class="topbar"><button class="back" data-act="end-session">'+I.back+'복습 탭</button></div>'+
      '<header class="page-head"><span class="eyebrow">'+title+'</span><h1 class="page-title">끝났어요</h1></header>'+
      '<div class="stat-grid"><div class="stat"><span class="num">'+s.done+'</span><span>푼 카드</span></div><div class="stat"><span class="num">'+s.right+'</span><span>맞힌 카드</span></div></div>'+
      '<p>'+(s.mode==="review" ? (left===0 ? '오늘 복습할 카드를 모두 끝냈어요. 맞힌 카드는 다음 복습 날에 다시 만나요.' : '아직 '+left+'장이 남았어요.') : '추가 연습은 복습 일정을 바꾸지 않아요.')+'</p>'+
      '<div class="actions">'+(s.mode==="review"&&left===0&&Object.keys(S.cards).length?'<button class="btn btn-line" data-act="start-extra">추가 연습 '+Math.min(EXTRA_N,Object.keys(S.cards).length)+'장</button>':'')+'<button class="btn btn-primary" data-act="end-session">완료</button></div>';
  }
  const id=s.queue[s.idx], {unit,qi}=parseCard(id), c=S.cards[id];
  const pct = Math.round(s.done/(s.queue.length)*100);
  return '<div class="topbar"><button class="back" data-act="end-session">'+I.back+'그만하기</button><span class="muted small" style="padding-right:10px;font-variant-numeric:tabular-nums">'+(s.done+1)+' / '+s.queue.length+'</span></div>'+
    '<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
    '<div class="card-from"><span class="en">UNIT '+pad(unit.id)+'</span> · '+esc(unit.sub)+(s.mode==="review"&&c?' · '+c.box+'단계':'')+'</div>'+
    '<div id="session-card" class="q" style="border-top:0;padding-top:4px"></div>';
}
function mountSessionCard(focus){
  const s=V.session; const el=$("#session-card"); if(!el) return;
  const id=s.queue[s.idx], {unit,qi}=parseCard(id);
  const acts = '<div class="actions"><button class="btn btn-line" data-act="revisit" data-id="'+unit.id+'">문법 다시 보기</button><button class="btn btn-primary" data-act="next-card" id="next-card">다음 카드</button></div>';
  el.innerHTML = questionHTML(unit.quiz[qi], s.order, s.chosen, (s.mode==="review"?"복습":"연습")+" 카드", acts);
  if(focus){ const f=el.querySelector(".fb"); if(f) f.focus({preventScroll:true}); }
}
function answerSession(oi){
  const s=V.session; if(s.chosen!==null) return;
  s.chosen=oi; const id=s.queue[s.idx], ok=oi===0;
  record(id, ok, s.mode==="review"?"review":"extra");
  if(ok) s.right++;
  else if(s.mode==="review") s.queue.push(id); // 1단계 카드: 오늘 다시
  mountSessionCard(true);
}
function nextCard(){ const s=V.session; s.done++; s.idx++; if(s.idx<s.queue.length) prepCard(); render(true); }

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=Number(b.dataset.id);
  switch(act){
    case "tab": go(b.dataset.tab); break;
    case "open": openUnit(id); break;
    case "close-unit": closeUnit(); break;
    case "fav": toggleFav(id); b.setAttribute("aria-pressed", isFav(id)); if(V.tab==="study"&&V.favOnly&&!V.unit) render(); if(V.tab==="today"&&!V.unit) render(); break;
    case "fav-only": V.favOnly=!V.favOnly; render(); { const t=$("#fav-toggle"); if(t) t.focus(); } break;
    case "speak": { const u=unitById(V.unit); speak(plain(u.examples[Number(b.dataset.i)][0]), b); } break;
    case "answer": {
      const oi=Number(b.dataset.oi);
      if(V.unit){ const qEl=b.closest(".q"); answerUnit(unitById(V.unit), Number(qEl.dataset.qi), oi); }
      else if(V.session) answerSession(oi);
    } break;
    case "retry-quiz": { const u=unitById(V.unit); freshQuiz(u); mountUnitQuiz(u); const q=$("#quiz-sec"); if(q) q.scrollIntoView({block:"start"}); } break;
    case "go-review": go("review"); break;
    case "go-new": { const nu=nextUnit(); if(nu){ V.tab="study"; openUnit(nu.id); } else go("study"); } break;
    case "toggle-read": { const l=dayLog(); l.read=!l.read; save(); render(); const r=document.querySelector('[data-act="toggle-read"]'); if(r) r.focus(); } break;
    case "start-review": startSession("review"); break;
    case "start-extra": startSession("extra"); break;
    case "next-card": nextCard(); break;
    case "revisit": openUnit(id, true); break;
    case "end-session": V.session=null; V.tab="review"; render(true); break;
    case "reset-ask": V.resetAsk=true; render(); { const y=$("#reset-yes"); if(y) y.focus(); } break;
    case "reset-no": V.resetAsk=false; render(); break;
    case "reset-yes": S=blank(); save(); try{ localStorage.removeItem(KEY); }catch(err){} V.resetAsk=false; for(const k in unitQuiz) delete unitQuiz[k]; render(true); break;
  }
});
try{ if(window.speechSynthesis) window.speechSynthesis.getVoices(); }catch(e){}
render();
})();
</script>
